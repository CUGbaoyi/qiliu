name: Desktop

# Windows (WebView2 + NSIS) 与 Linux (WebKitGTK + deb/AppImage) 桌面客户端构建。
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src-tauri/**'
      - 'native/desktop-core/**'
      - 'src/**'
      - 'server/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'native/desktop-core/**'
      - 'src/**'
      - 'server/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            bundles: nsis
            artifact: qiliu-windows
          - label: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: qiliu-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Test Rust core
        run: cargo test --manifest-path native/desktop-core/Cargo.toml

      - name: Build frontend
        run: npm run build

      - name: Build desktop bundles
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/qiliu-desktop
            src-tauri/target/release/qiliu-desktop.exe

  macos:
    name: Build macOS installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build macOS bundle
        run: QILIU_INSTALLERS="$GITHUB_WORKSPACE/installers" scripts/build-native.sh mac

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: qiliu-macos
          if-no-files-found: error
          path: installers/Qiliu-*-mac-universal.zip

  android:
    name: Build Android APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Resolve Android SDK root
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Decode signing keystore
        env:
          KEY_BASE64: ${{ secrets.QILIU_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$KEY_BASE64" ]; then
            echo "QILIU_SIGNING_KEY_BASE64 is missing" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/qiliu.jks"

      - name: Build signed APK
        env:
          QILIU_SIGNING_KEY: ${{ runner.temp }}/qiliu.jks
          QILIU_SIGNING_PASSWORD: ${{ secrets.QILIU_SIGNING_PASSWORD }}
          QILIU_INSTALLERS: ${{ github.workspace }}/installers
        run: scripts/build-native.sh android

      - name: Verify APK signature
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs installers/Qiliu-*-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qiliu-android
          if-no-files-found: error
          path: installers/Qiliu-*-android.apk

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 栖流 ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/qiliu-windows/**/*.exe
            artifacts/qiliu-linux/**/*.deb
            artifacts/qiliu-linux/**/*.AppImage
            artifacts/qiliu-macos/**/*.zip
            artifacts/qiliu-android/**/*.apk
          body: |
            ## 栖流 ${{ github.ref_name }}

            - Windows / Linux 独立桌面客户端（Tauri 2）
            - M-Team 登录提醒与 40 天倒计时
            - Rust 桌面核心（白名单 / SSRF / Vault / HTTP）

            Windows、Linux、macOS 与 Android 安装包由 GitHub Actions 在对应系统构建；
            Android APK 使用原签名（与 0.4.0 证书一致，可覆盖安装）。安装包未做代码签名，
            Linux 需要系统 WebKitGTK 4.1。

            详细变更见 [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)。

